<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Login | BuildCrew</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0a3d62, #144f82);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== CARD ===== */

        .admin-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 36px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        /* ===== TITLE ===== */

        .admin-card h2 {
            margin: 0 0 10px;
            text-align: center;
            color: #0a3d62;
            font-size: 24px;
        }

        .admin-card p {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 28px;
        }

        /* ===== FORM ===== */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0a3d62;
            box-shadow: 0 0 0 2px rgba(10, 61, 98, 0.15);
        }

        /* ===== BUTTON ===== */

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #0a3d62;
            color: #fff;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #144f82;
        }

        /* ===== WARNING ===== */

        .warning {
            margin-top: 20px;
            padding: 12px;
            background: #eef4fb;
            border-left: 4px solid #0a3d62;
            font-size: 13px;
            color: #444;
            border-radius: 6px;
        }

        /* ===== FOOTER ===== */

        .footer {
            position: fixed;
            bottom: 12px;
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.85);
            padding: 0 10px;
        }

        /* ================= MOBILE OPTIMIZATION ================= */

        @media (max-width: 480px) {

            body {
                align-items: flex-start;
                padding-top: 40px;
            }

            .admin-card {
                padding: 24px;
                border-radius: 10px;
            }

            .admin-card h2 {
                font-size: 22px;
            }

            .admin-card p {
                font-size: 13px;
                margin-bottom: 22px;
            }

            .form-group input {
                padding: 11px;
                font-size: 14px;
            }

            .login-btn {
                font-size: 15px;
                padding: 12px;
            }
        }

        /* Very small phones */
        @media (max-width: 360px) {
            .admin-card {
                padding: 20px;
            }
        }

    </style>
</head>

<body>

    <div class="admin-card">

        <h2>Admin Login</h2>
        <p>Restricted access – authorized personnel only</p>

        <form action="/admin_login" method="post">
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email"  name="email" placeholder="Enter admin email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>

            <button class="login-btn" type="submit" action="submit" value="login">Login</button>
        </form>

        <div class="warning">
            ⚠ Unauthorized access is prohibited and may be monitored.
        </div>

    </div>

    <div class="footer">
        © 2025 VEDSP Inventive Private Limited. Internal System.
    </div>

    <script>
        function goadmin() {
            window.location.href = "admin_dashboard.html";
        }
        if(message){ alert(message); }
    </script>
</body>

</html>
